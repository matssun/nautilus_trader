[package]
name = "nautilus-blockchain"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Blockchain and DeFi integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_blockchain"
crate-type = ["rlib", "cdylib"]

[features]
# NOTE (monorepo-local-fixes fork only): `hypersync` is promoted to a
# default feature so that Bazel's crate_universe resolves
# hypersync-client / hypersync-schema and their transitive deps.
# rules_rust 0.68's crate.from_cargo does not expose per-crate feature
# overrides, and without this the gated modules under src/hypersync,
# src/cache, src/data, src/execution, src/exchanges, src/factories,
# and src/services cannot compile — leaving the blockchain adapter a
# skeleton of RPC primitives with no actual Nautilus integration.
# Upstream should not take this change; it's strictly a Bazel build
# concern.
default = ["hypersync"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-model/extension-module",
  "nautilus-network/extension-module",
  "python",
  "pyo3/extension-module",
]
hypersync = ["hypersync-client", "hypersync-schema"]
python = [
  "nautilus-infrastructure/python",
  "nautilus-live/streaming",
  "nautilus-network/python",
  "nautilus-system/python",
  "pyo3",
  "pyo3-stub-gen",
]
turmoil = ["dep:turmoil", "nautilus-network/turmoil"]

[package.metadata.docs.rs]
features = ["python"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["defi", "live"] }
nautilus-core = { workspace = true }
nautilus-infrastructure = { workspace = true, features = ["postgres"] }
nautilus-live = { workspace = true, features = ["defi"] }
nautilus-model = { workspace = true, features = ["defi"] }
nautilus-network = { workspace = true }
nautilus-system = { workspace = true }

ahash = { workspace = true }
alloy = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
dotenvy = { workspace = true }
enum_dispatch = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }

hypersync-client = { workspace = true, optional = true }
hypersync-schema = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
turmoil = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }
turmoil = { workspace = true }

[[bin]]
name = "node_wallet"
path = "bin/node_wallet.rs"
required-features = ["hypersync"]
doc = false
test = false

[[example]]
name = "blockchain-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["hypersync"]
doc = false
